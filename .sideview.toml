# sideview, configuring itself — committed, because this is versioned intent
# while .sideview/ holds disposable machinery.
#
# A page that can declare its own label, order and category does so in canon:
# see the <sv-page> tags in V3.sv and friends. This file is for the files
# that cannot — the project's markdown — and for what must outlive the db.

port = 46423

[[pages]]
path = "HANDOFF.md"
label = "Handoff"
category = "state"
order = 3

