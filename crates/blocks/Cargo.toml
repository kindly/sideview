[package]
name = "sideview-blocks"
version = "0.5.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.104"
# syntect-fancy: the pure-Rust regex backend, not the C oniguruma one (V1.md).
comrak = { version = "0.54.0", default-features = false, features = ["syntect-fancy"] }
csv = "1.4.0"
diffy = "0.5.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"
