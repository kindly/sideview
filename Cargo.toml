[package]
name = "sideview"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
actix-web-lab = "0.26.0"
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
comrak = { version = "0.54.0", default-features = false }
futures-util = "0.3.33"
if-addrs = "0.15.0"
libc = "0.2.189"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-embed = "8.12.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.24.0", features = ["v4"] }
