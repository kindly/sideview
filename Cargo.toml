[package]
name = "sideview"
version = "0.3.0"
edition = "2024"
description = "A visual side channel for CLI agents: pages are .sv files in your project, rendered live in the browser as agents (or you) write them"
license = "MIT"
readme = "README.md"
keywords = ["agent", "cli", "markdown", "live", "daemon"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/kindly/sideview"
# A whitelist, not an exclude list: the working directory holds sandbox
# mount artifacts (char-device .bash_profile and friends) that must never
# reach the crate — and the crate needs only what the binary embeds.
include = ["src/**", "static/**", "skills/**", "README.md", "LICENSE", "THIRD-PARTY.md"]

[dependencies]
actix-web = "4.14.0"
actix-web-lab = "0.26.0"
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
csv = "1.4.0"
# syntect-fancy: the pure-Rust regex backend, not the C oniguruma one (V1.md).
comrak = { version = "0.54.0", default-features = false, features = ["syntect-fancy"] }
diffy = "0.5.1"
futures-util = "0.3.33"
if-addrs = "0.15.0"
libc = "0.2.189"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-embed = "8.12.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"
similar = "3.1.2"
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1.53.1", features = ["sync", "rt", "process", "io-util", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.24.0", features = ["v4"] }

# Fat LTO earns its keep here: measured on the DataFusion probe it cut a
# binary 90 -> 35 MB (V3.sv, 2026-08-16). CI pays the link time, every
# download shrinks; dev builds are untouched.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
