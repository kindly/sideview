<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>sideview</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/sideview.css">
  <script>
    // Before first paint, and again on OS theme change. Bootstrap 5.3 themes
    // entirely off this attribute; we ship none of its JS. The viewer's
    // override (the header button, remembered in localStorage) wins over the
    // OS — the same viewer-beats-default pattern as the rail fold.
    const svTheme = () => {
      const pref = localStorage.getItem('sv-theme');
      const mode = (pref === 'light' || pref === 'dark') ? pref
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', mode);
    };
    svTheme();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', svTheme);
  </script>
</head>
<body>
  <header id="sv-header">
    <div id="sv-brand" title="connected">
      <!-- The reviewer (logo.svg, thread 59) inlined so currentColor follows
           the theme — and the mark IS the liveness indicator (V4.sv, thread
           64): open and glancing = live, half-lidded = reconnecting, lids
           drawn and pupils hidden = daemon gone. Lids are separate elements
           toggled by body state classes: structure over override. -->
      <svg id="sv-logo" viewBox="0 0 96 58" aria-hidden="true">
        <path d="M10,15 Q22,11 36,13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <!-- The raised brow is a live expression: when the lids draw, it
             swaps for a resting brow symmetric to the left (thread 75). -->
        <path class="sv-brow-live" d="M59,12 Q73,5 87,11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path class="sv-brow-rest" d="M60,15 Q72,11 86,13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <rect x="4" y="19" width="38" height="28" rx="10" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="54" y="19" width="38" height="28" rx="10" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M42,28 Q48,23 54,28" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle class="sv-pupil" cx="33" cy="33" r="6" fill="currentColor"/>
        <circle class="sv-pupil" cx="83" cy="33" r="6" fill="currentColor"/>
        <path class="sv-lid sv-lid-half" d="M8,26 H38 M58,26 H88" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path class="sv-lid sv-lid-closed" d="M8,33 H38 M58,33 H88" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span id="sv-wordmark">sideview</span>
    </div>
    <nav id="sv-pages" aria-label="pages"></nav>
    <div id="sv-status" role="status" hidden>reconnecting…</div>
    <button id="sv-theme" type="button" aria-label="theme"></button>
  </header>
  <aside id="sv-outline" aria-label="contents">
    <div id="sv-outline-top">
      <span id="sv-outline-title">Contents</span>
      <button id="sv-rail-toggle" type="button" aria-expanded="true"
              aria-label="collapse contents"></button>
    </div>
    <nav id="sv-outline-list"></nav>
  </aside>
  <main id="sv-blocks"></main>
  <!-- The comment bar: conversations live here, not inline — the first Vue
       island (see V2.sv's feedback section and HANDOFF's framework note). -->
  <aside id="sv-comments" aria-label="comments"></aside>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
