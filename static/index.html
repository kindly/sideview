<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>sideview</title>
  <link rel="stylesheet" href="/assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/sideview.css">
  <script>
    // Before first paint, and again on OS theme change. Bootstrap 5.3 themes
    // entirely off this attribute; we ship none of its JS. The viewer's
    // override (the header button, remembered in localStorage) wins over the
    // OS — the same viewer-beats-default pattern as the rail fold.
    const svTheme = () => {
      const pref = localStorage.getItem('sv-theme');
      const mode = (pref === 'light' || pref === 'dark') ? pref
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', mode);
    };
    svTheme();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', svTheme);
  </script>
</head>
<body>
  <header id="sv-header">
    <div id="sv-brand" title="connected">
      <span id="sv-dot" aria-hidden="true"></span>
      <span id="sv-wordmark">sideview</span>
    </div>
    <nav id="sv-sessions" aria-label="sessions"></nav>
    <div id="sv-status" role="status" hidden>reconnecting…</div>
    <button id="sv-theme" type="button" aria-label="theme"></button>
  </header>
  <aside id="sv-outline" aria-label="contents">
    <div id="sv-outline-top">
      <span id="sv-outline-title">Contents</span>
      <button id="sv-rail-toggle" type="button" aria-expanded="true"
              aria-label="collapse contents"></button>
    </div>
    <nav id="sv-outline-list"></nav>
  </aside>
  <main id="sv-blocks"></main>
  <script src="/assets/vendor/mermaid.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
